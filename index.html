  const d=Math.sqrt(d2)||0.01,nx=dx/d,nz=dz/d,pen=rr-d,ma=A.mass,mb=B.mass;
  A.pos.x-=nx*pen*mb/(ma+mb);A.pos.z-=nz*pen*mb/(ma+mb);B.pos.x+=nx*pen*ma/(ma+mb);B.pos.z+=nz*pen*ma/(ma+mb);
  const vn=(A.vel.x-B.vel.x)*nx+(A.vel.z-B.vel.z)*nz;if(vn>0){const j=1.3*vn/(1/ma+1/mb);A.vel.x-=j*nx/ma;A.vel.z-=j*nz/ma;B.vel.x+=j*nx/mb;B.vel.z+=j*nz/mb;if(vn>5){A.hit(vn);B.hit(vn)}}}
}
function respawnTraffic(v){const Z=G.zone,p=G.player;for(let t=0;t<30;t++){const k=Z.roads[(Math.random()*Z.roads.length)|0],c=cellPos(Z,k),d=Math.hypot(c.x-p.pos.x,c.z-p.pos.z);
  if(d>200&&d<380){v.place(c.x,c.y+0.5,c.z,Math.random()*6.28);v.ai.cell=k;v.ai.tgt=null;v.ai.dir=null;return}}}
function frame(){
 requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),0.05);skyRoot.position.copy(camera.position);
 if(G.show){showTick(dt)}
 else if(G.zone){
  const Z=G.zone;Z.mixers.forEach(m=>m.update(dt));Z.spin.forEach(o=>o.rotation.y+=dt*3);
  if(!G.paused&&G.player){
   const p=G.player;readInput(p);if(MS.active&&MS.state==='count'){p.in.th=0;p.in.br=1}
   if(G.racers.length){const hold=!(MS.active&&MS.state==='run');G.racers.forEach(v=>v.ai.hold=hold)}
   for(let s=0;s<2;s++){const h=dt/2;for(const v of G.veh){
     if(v!==p&&G.traffic.includes(v)){const far=Math.hypot(v.pos.x-p.pos.x,v.pos.z-p.pos.z);v.obj.visible=far<450;if(far>520)respawnTraffic(v);if(far>450)continue}
     v.think(h);v.update(h)}collideVehicles()}
   missionTick(dt);pursuitTick(dt);smokeTick(dt);
   if(osc){const sp=Math.hypot(p.vel.x,p.vel.z);osc.frequency.value=40+sp*3.2+(p.in.th?14:0);osc2.frequency.value=(40+sp*3.2)*0.5;
    if(siren){let nd=1e9;for(const c of G.cops)nd=Math.min(nd,c.pos.distanceTo(p.pos));siren.g.gain.value=PU.on&&nd<300?0.03*SET.volume*(1-nd/300):0;siren.frequency.value=(performance.now()/450|0)%2?760:560}}
   updateCam(dt);hud();drawMap();[gateA,gateB].forEach(g=>g.rotation.z+=dt);
  }else if(G.player)updateCam(0.0001);
 }else{camera.position.set(0,50,100);camera.lookAt(0,0,0)}
 {const spd=G.player&&!G.show?Math.hypot(G.player.vel.x,G.player.vel.z):0;bloom.strength=SET.bloom?QUAL[SET.quality].bloom:0;fxPass.uniforms.amt.value=SET.blur?clamp((spd-35)/55,0,1)+(G.player&&G.player.in.nit&&G.player.nitro>0?0.4:0):0;fxPass.uniforms.vig.value=SET.blur?0.32:0;if(rain.visible)rainTick(dt);composer.render()}
}
frame();
addEventListener('error',e=>console.error(e.message));
</script></body></html>
